<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card - Sandesh Jamkatel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>

    <div id="card-parent">
        <div class="background-section">
            <button>Follow + </button>
        </div>
        <div class="profile-section">
            <img src="profile.jpg" width="100px" alt="profile_pic_smily_person">
            <span>Exp</span>
            <divn class="grid-parent">
                <div class="grid-item item1"></div>
                <div class="grid-item item2"></div>
                <div class="grid-item item3"></div>
                <div class="grid-item item4"></div>
                <div class="grid-item item5"></div>
                <div class="grid-item item6"></div>
                <div class="grid-item item7"></div>
                <div class="grid-item item8"></div>
                <div class="grid-item item9"></div>
                <div class="grid-item item10"></div>
            </div>
            <div class="user-details">
                <h1>Noah Thompson</h1>
                <p>Product Designer who focuses on simplicity & Usabiltity</p>
            </div>
             <div class="other-info-section">
            <div class="info">
                <div class="headingTwo">
                    <h2>72.9k</h2>
                </div>
               <div class="paragarph">
                 <p>Likes</p>
               </div>
            </div>
            <div class="info">
                <div class="headingTwo">
                    <h2>288</h2>
                </div>
                <div class="paragraph">
                    <p>Posts</p>
                </div>
            </div>
            <div class="info">
                <div class="headingTwo">
                    <h2>322k</h2>
                </div>
               <div class="paragraph">
                 <p>Followers</p>
               </div>
            </div>
            <div class="info"><i class="fa-brands fa-instagram"></i></div>
            <div class="info"><i class="fa-brands fa-twitter"></i></div>
            <div class="info"><i class="fa-brands fa-threads"></i></div>
        </div>
        </div>
         
    </div>
    
    
</body>
</html>
